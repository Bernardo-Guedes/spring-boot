spring.application.name=RadioBrowserAPI
radio.search.api.base.url=https://de1.api.radio-browser.info/json/stations/search

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.user.username=${DEFAULT_USER_USERNAME}
app.user.email=${DEFAULT_USER_EMAIL}
app.user.password=${DEFAULT_USER_PASSWORD}
app.admin.username=${DEFAULT_ADMIN_USERNAME}
app.admin.email=${DEFAULT_ADMIN_EMAIL}
app.admin.password=${DEFAULT_ADMIN_PASSWORD}